<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">OpenClaw Cross-Tool Commander</title>
  <desc id="hero-desc">Cross-tool command layer for XiaoyaoClaw / OpenClaw: any Agent Skills tool (Claude Code / Codex / OpenCode / Trae / DSH) can drive the OpenClaw gateway via CLI. Shows a terminal panel running openclaw agent with the agents list.</desc>

  <rect width="1200" height="360" rx="20" fill="#0d1117"/>

  <!-- left: title block -->
  <g id="title-block" transform="translate(56 40)">
    <text x="0" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="4" fill="#8b949e">OPENCLAW · AGENT SKILL</text>

    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#e6edf3">Commander</text>

    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#c9d1d9">跨工具指挥层 · 小遥Claw / OpenClaw</text>
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" fill="#8b949e">Claude Code · Codex · OpenCode · Trae · DSH</text>

    <text x="0" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="1" fill="#8b949e">MIT LICENSE · SKILL FOR OPENCLAW · v1.0.0</text>
  </g>

  <!-- right: commander terminal panel -->
  <g id="terminal-panel" transform="translate(700 44)">
    <rect width="450" height="276" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

    <!-- terminal dots -->
    <circle cx="18" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="20" r="5" fill="#27c93f"/>

    <text x="78" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8b949e">openclaw · gateway</text>

    <!-- command line -->
    <text x="24" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">$ openclaw agents list</text>

    <!-- agents list -->
    <text x="24" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#58a6ff">tiantong</text>
    <text x="140" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e6edf3">🛠️ 天桐</text>
    <text x="24" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#58a6ff">xiaoguang</text>
    <text x="140" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e6edf3">🎨 小光</text>
    <text x="24" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#58a6ff">xiaozhi</text>
    <text x="140" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e6edf3">🧠 小智</text>
    <text x="24" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">+ 4 more agents</text>

    <!-- delegate command -->
    <text x="24" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3fb950">$ openclaw agent -m "调研 X" --agent tiantong</text>

    <text x="24" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#e6edf3">result: 报告已输出 → tasks/x-research/</text>
    <text x="24" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#8b949e">ok · 614ms · via gateway</text>
  </g>
</svg>
